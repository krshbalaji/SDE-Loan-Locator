name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build web --release --base-href "/SDE-Loan-Locator/" --dart-define=TELEGRAM_RELAY_URL="$(printf '%s' "${{ secrets.TELEGRAM_RELAY_URL }}" | tr -d '\r\n ')" --dart-define=TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" --dart-define=TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
