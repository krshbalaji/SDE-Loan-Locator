name: Build Android APK & Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Run Unit Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload SDE-Loan-Locator APK
        uses: actions/upload-artifact@v4
        with:
          name: SDE-Loan-Locator-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Flutter Web App
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload SDE-Loan-Locator Web App
        uses: actions/upload-artifact@v4
        with:
          name: SDE-Loan-Locator-web-app
          path: build/web/
          retention-days: 30
